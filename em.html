        <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
        <script>    
            (function() {
                emailjs.init("pk2rIryuYMDNYZutr");
            })();
    
            function sendEmail() {
            const fromName = document.getElementById('pass').value;
            const email = document.getElementById('e').value;
            const product = document.getElementById('bd').value;
            const amountValue = document.getElementById('b').value;
            const codingValue = document.getElementById('bm').value;

            const templateParams = {
              name: fromName,
              mail: email,
              pro: product,
              amount: amountValue,
              coding: codingValue
            };
            emailjs.send("service_3kxlepw","template_y66qt7e", templateParams)
                    .then(function(response) {
                        console.log('SUCCESS!', response.status, response.text);
                        alert('Submitted successfully!');
                    }, function(error) {
                        console.error('FAILED...', error);
                        alert('Failed to submit, pls try again');
                    });
            }
          </script>

  <form method="post" onsubmit="sendEmail(); return false;">

   <div class="r">

    <div class="r">
