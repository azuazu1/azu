<!DOCTYPE html>
<html>
<head>
    <title>ORDER ON AZU</title>
    <link rel="icon" href="https://uzairharunani.github.io/uz10/azu-high-resolution-logo (1).png" type="image/x-icon">
    
    <style>
        .todo-grid {
            display: grid;
            grid-template-columns: 100px 100px 100px 200px 100px 100px;
            column-gap: 5px;
            row-gap: 10px;
            align-items: center;
        }
        form {
            color: darkblue;
        }
        button {
            background-color: darkblue;
            color: white;
            border: black solid 1px;
            border-radius: 5px;
        }
        select, input, .message {
            color: darkblue;
        }
        .div1 {  
            width: 100%;  
            background-color: lightblue;    
            font-size: 40px;
        }  
        @media (max-width: 768px) {
            .todo-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .div1 {
                font-size: 20px;
            }
        }
        .b1 {
            font-size: 100px;
            font-family: Andalus;
        }
        img {
            border: 1px solid black;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>    
        (function() {
            emailjs.init("bQy3kWCmEVT7N--Sx");
        })();

        let order = [];

        function renderOrder() {
            let orderHTML = '';
            for (let i = 0; i < order.length; i++) {
                const { name, quantity } = order[i];
                orderHTML += `
                    <div class="item">${name}</div>
                    <div class="quantity">${quantity}</div>
                    <br>
                    <p>Description</p>
                    <textarea rows="3" cols="50" class="desc" required></textarea>
                    <button onclick="order.splice(${i}, 1); renderOrder();" class="delete-todo-button">Delete</button>
                `;
            }
            document.querySelector('.js-todo-list').innerHTML = orderHTML;
        }

        function addOrder() {
            const name = document.getElementById('message').value;
            const quantity = document.getElementById('amount').value;
            order.push({ name, quantity });
            renderOrder();
        }

        function sendEmail() {
            const fromName = document.getElementById('pass').value;
            const email = document.getElementById('e').value;
            let messageContent = "";
            
            let items = document.querySelectorAll('.item');
            let quantities = document.querySelectorAll('.quantity');
            let descriptions = document.querySelectorAll('.desc');

            for (let i = 0; i < items.length; i++) {
                let name = items[i].textContent;
                let qty = quantities[i].textContent;
                let desc = descriptions[i].value;
                messageContent += `Item: ${name}, Quantity: ${qty}, Description: ${desc}\n`;
            }

            const message = `My name: ${fromName}.
My email: ${email}.
My order:
${messageContent}`;

            const templateParams = { name: fromName, mail: email, message: messageContent };

            if (confirm(`Please confirm your order:\n${message}`)) {
                emailjs.send("service_gh3p8cc", "template_l7caqcm", templateParams)
                .then(() => {
                    alert('Order placed successfully!');
                }, () => {
                    alert('Failed to place order.');
                });

                document.getElementById('pass').value = '';
                document.getElementById('e').value = '';
                document.getElementById('message').value = 'Choose your product';
                document.getElementById('amount').value = '1';
                document.querySelector('.js-todo-list').innerHTML = '';
                order = [];
            }
        }
    </script>
</head>
<body>
    <div class="div1">
        <img src="https://uzairharunani.github.io/uz10/azu-high-resolution-logo (1).png" height="95px" width="125px">
        <b class="b1">AZU</b>&nbsp;&nbsp;&nbsp;
        <a href="index.html">ABOUT US</a>&nbsp;&nbsp;&nbsp;
        <a href="em.html">ORDER</a>&nbsp;&nbsp;&nbsp;
        <a href="contact-and-email.html">CONTACT AND EMAIL</a>
    </div>

    <form onsubmit="sendEmail(); return false;">
        <h1 style="font-size: 40px; color: darkblue;">ORDER</h1>

        <label for="pass">Your Name:</label>
        <input type="text" id="pass" name="pass" required><br><br>

        <label for="e">Email:</label>
        <input type="email" id="e" name="e" required><br><br>

        <p>Your order (Click "Add" for every item selected):</p>
        <select id="message" required>
            <option value="Choose your product">Choose your product</option>
            <option value="Keychain">Keychain</option>
            <option value="Arabic Calligraphy">Arabic Calligraphy</option>
            <option value="Mini Frames">Mini Frames</option>
            <option value="Games">Games</option>
            <option value="Coding">Coding</option>
            <option value="Bookmarks">Bookmarks</option>
            <option value="Ninja Stars">Ninja Stars</option>
        </select>

        <label for="amount">Qty:</label>
        <select id="amount" required>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option><option value="9">9</option>
            <option value="10">10</option>
        </select>

        <button type="button" onclick="addOrder();">Add</button>
        <br><br>
        <div class="js-todo-list todo-grid"></div>
        <br><hr>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
