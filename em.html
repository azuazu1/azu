        <script>    
            (function() {

let order = [];

// Function to render the order list and total price
function renderorder() {
    let orderHTML = '';
    let totalPrice = 0; // Initialize total price

    for (let i = 0; i < order.length; i++) {
        const { name, dueDate, price } = order[i];
        totalPrice += parseFloat(price) || 0; // Sum up the prices

        const html = `
            <div id="item" class="item">${name}</div>
            <div id="quantity" class="quantity">${dueDate}</div>
            <div id="price" class="price">${price} TZS</div>
            <button onclick="
                order.splice(${i}, 1);
                renderorder();
            " class="delete-todo-button">Delete</button>
        `;
        orderHTML += html;
    }


    document.querySelector('.js-todo-list').innerHTML = orderHTML;
}

// Function to add an order item
function addorder() {
    const nameInputElement = document.getElementById('message');
    const name = nameInputElement.value;
    const dateInputElement = document.getElementById('amount');
    const dueDate = dateInputElement.value;

    // Calculate price based on the selected item
    let price = 0;
    if (name === 'Keychain') {
        price = 500 * parseInt(dueDate, 10);
    } else if (name === 'Arabic Calligraphy') {
        price = 500 * parseInt(dueDate, 10);
    } else if (name === 'Mini Frames') {
        price = 1000 * parseInt(dueDate, 10);
    } else if (name === 'Games') {
        price = 2000 * parseInt(dueDate, 10);
    } else if (name === 'Coding') {
        price = 2500 * parseInt(dueDate, 10);
    } else if (name === 'Bookmarks') {
        price = 500 * parseInt(dueDate, 10);
    } else if (name === 'Ninja Stars') {
        price = 500 * parseInt(dueDate, 10);
    }  
    // Push the order details to the array
    order.push({ name, dueDate, price });
    renderorder();

    }  
            function sendEmail() {
            const fromName = document.getElementById('pass').value;
            const email = document.getElementById('e').value;
            const product = document.getElementById('bd').value;
            const amountValue = document.getElementById('b').value;
            const codingValue = document.getElementById('bm').value;

            const templateParams = {
              name: fromName,
              mail: email,
              pro: product,
              amount: amountValue,
              coding: codingValue
            };
            emailjs.send("service_3kxlepw","template_y66qt7e", templateParams)
                    .then(function(response) {
                        console.log('SUCCESS!', response.status, response.text);
                        alert('Submitted successfully!');
                    }, function(error) {
                        console.error('FAILED...', error);
                        alert('Failed to submit, pls try again');
                    });
            }
          </script>
