        <script>    
            (function() {
                emailjs.init("bQy3kWCmEVT7N--Sx");

let order = [];

// Function to render the order list and total price
function renderorder() {
    let orderHTML = '';

    for (let i = 0; i < order.length; i++) {
        const { name, dueDate,} = order[i];

        const html = `
            <div id="item" class="item">${name}</div>
            <div id="quantity" class="quantity">${dueDate}</div>
            <br>
            <p>Description</p>
            <textarea rows="3" cols="100" id="des"></textarea>
            <button onclick="
                order.splice(${i}, 1);
                renderorder();
            " class="delete-todo-button">Delete</button>
        `;
        orderHTML += html;
    }


    document.querySelector('.js-todo-list').innerHTML = orderHTML;
}

// Function to add an order item
function addorder() {
    const nameInputElement = document.getElementById('message');
    const name = nameInputElement.value;
    const dateInputElement = document.getElementById('amount');
    const dueDate = dateInputElement.value;
    // Push the order details to the array
    order.push({ name, dueDate,});
    renderorder();

    }  

            function sendEmail() {
            const fromName = document.getElementById('pass').value;
            const email = document.getElementById('e').value;
            let messageContent = document.querySelector('.todo-grid').textContent;
            let des = document.getElementById('des').value;
            messageContent += des;
            messageContent = messageContent.replaceAll('Delete', '');
            const message = `My name ${fromName}.\nMy email: ${email}.\nMy order:\n${messageContent}.`

            const templateParams = {
              name: fromName,
              mail: email,
              message: messageContent
            };
            console.log(templateParams);

                if (confirm(`Please confirm your order below\n` + templateParams.message)) {

    // Send the email using EmailJS
    emailjs.send("service_gh3p8cc","template_l7caqcm", templateParams);
        then(function(response) {
            console.log('SUCCESS!', response.status, response.text);
            alert('Order placed successfully!');
        }, function(error) {
            console.error('FAILED...', error);
            alert('Failed to place order.');
        });

    // Clear input fields after sending the email
    document.getElementById('from_name').value = '';
    document.getElementById('from_email').value = '';
    document.getElementById('grid').textContent = '';
    document.getElementById('message').value = '';
    document.getElementById('amount').value = '';
    document.querySelector('.js-todo-list').innerHTML = '';
    order = [];

    orderHTML = '';
    removeTextareas(); // Clear the address input if present
    }
            }
          </script>
