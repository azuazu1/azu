<!DOCTYPE html>
<html>
  <head>
    <title>
      ORDER ON AZU
    </title>
    <style>
      label {
        font-size: 32px;
      }

      .div {
        background-color: lightblue;
      }
    </style>
        <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
        <script>    
            (function() {
                emailjs.init("pk2rIryuYMDNYZutr");
            })();
    
            function sendEmail() {
            const fromName = document.getElementById('pass').value;
            const email = document.getElementById('e').value;
            const product = document.getElementById('bd').value;
            const amountValue = document.getElementById('b').value;
            const codingValue = document.getElementById('bm').value;

            const templateParams = {
              name: fromName,
              mail: email,
              pro: product,
              amount: amountValue,
              coding: codingValue
            };
            emailjs.send("service_3kxlepw","template_y66qt7e", templateParams)
                    .then(function(response) {
                        console.log('SUCCESS!', response.status, response.text);
                        alert('Submitted successfully!');
                    }, function(error) {
                        console.error('FAILED...', error);
                        alert('Failed to submit, pls try again');
                    });
            }
          </script>    
  </head>
  <body>

    <div class="div">
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img src="https://uzairharunani.github.io/uz10/azu-high-resolution-logo (1).png" height="95px" width="125px" style="border: 1px solid black;">&nbsp;&nbsp;&nbsp;<b style="font-size: 100px; font-family: Andalus; position: relative; bottom: 10px;">AZU</b>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="index.html" style="position: relative; bottom: 30px; font-size: 40px; font-family: Andalus;">ABOUT US</a>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="em.html" style="font-size: 40px; font-family: Andalus; position: relative; bottom: 30px;">ORDER</a>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="contact-and-email.html" style="position: relative; bottom: 30px; font-size: 40px; font-family: Andalus;">CONTACT AND EMAIL</a>
</div>

  <form method="post" onsubmit="sendEmail(); return false;">

    <center>

      <h1 style="font-size: 40px; font-family: Algerian;"><u>ORDER</u></h1>

      <div class="r">
        <label for="pass">your name:</label>
        <input type="text" id="pass" name="pass" required>
      </div>

      <br>

   <div class="r">
      <label for="e">email:</label>
      <input type="email" id="e" name="e"required>
    </div>

    <br>

    <div class="r">
      <label for="bd">Product:</label>
      <select id="bd" name="bd" required>
  
        <option value="Keychain">Keychain</option>
        <option value="Arabic calligraphy">Arabic calligraphy</option>
        <option value="Microsoft problems">Microsoft problems</option>
        <option value="Coding">Coding</option>
        <option value="Mini frames">Mini frames</option>
        <option value="Games">Games</option>
        <option value="Bookmarks">Bookmarks</option>  
      </select>
    </div>

    <br>

    <div class="r">
      <label for="b">Amount:</label>
      <select id="b" name="b">
  
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
  
      </select>

      <br>
      
      <label for="bm">What you want for coding:</label>
      <textarea id="bm" name="bm" rows="3"></textarea>
    </div>

  <br>

  <div class="p">
    <button type="submit">Submit</button>
  </div>

    </center>
  </form>
</body>
</html>
